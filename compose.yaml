services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traic
      POSTGRES_USER: traic
      POSTGRES_PASSWORD: traic
    ports:
      - "5432:5432"
    volumes:
      - traic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traic -d traic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  traic-postgres:
